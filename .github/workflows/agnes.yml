name: Agnes 视频生成

"on":            # 加引号：YAML 会把裸 on 解析成布尔 true，GitHub 建 tree 时会报错
  schedule:
    # 每 2 小时跑一次（UTC，第 17 分钟错开整点高峰）
    - cron: '17 */2 * * *'
  workflow_dispatch:          # 也可以在网页上手动点运行

concurrency:
  group: agnes-gen
  cancel-in-progress: false   # 上一次没跑完就排队，别浪费已排到的位置

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 360      # GitHub 单次任务上限 6 小时
    permissions:
      contents: write         # 允许把产出提交回仓库
    env:
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 写入 Agnes API Key
        run: |
          mkdir -p ~/.workbuddy/skills/agnes-video/scripts
          echo "$AGNES_API_KEY" > ~/.agnes_key
          chmod 600 ~/.agnes_key

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 开始生成
        run: bash cloud_run.sh

      - name: 把产出提交回仓库
        run: |
          git config user.name "Agnes Bot"
          git config user.email "agnes-bot@users.noreply.github.com"
          git add -A output/ || true
          git commit -m "chore: 更新产出 $(date -u +%Y-%m-%d_%H:%M)" || true
          git push || echo "推送失败，可从 Artifacts 下载"

      - name: 打包产出供下载
        uses: actions/upload-artifact@v4
        with:
          name: agnes-output-${{ github.run_number }}
          path: |
            output/
            scripts/logs.txt
          retention-days: 60
